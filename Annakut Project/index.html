<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Harisumiran Annakut Mahotsav 2025</title>
    <meta charset="utf-8" />
    <meta name="description" content="&lt;model-viewer&gt; template" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Gujarati:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Cache-busting version - Update this when you deploy changes -->
    <script>
      window.APP_VERSION = '1.0.0';
    </script>
    <link type="text/css" href="./styles.css?v=1.0.0" rel="stylesheet" />
  </head>
  <body>
    <!-- 3D Model Viewer -->
    <model-viewer
      src="Untitled.glb?v=1.0.0"
      camera-controls
      camera-orbit="0deg 10deg 15m"
      camera-target="0m 1m 0m"
      field-of-view="30deg"
      min-camera-orbit="-60deg 80deg 13m"
      max-camera-orbit="60deg 90deg 15m"
      tone-mapping="neutral"
      shadow-intensity="1"
      environment-image="legacy"
      poster=""
    >
      <button
        class="Hotspot"
        slot="hotspot-1"
        data-position="-6.02232408229849m 2.4569471054041356m -1.062326963910436m"
        data-normal="0m -1.3435883843274954e-7m 0.999999999999991m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Divine Manifestation</div>
      </button>
      <button
        class="Hotspot"
        slot="hotspot-2"
        data-position="-7.219767760766976m 1.680860583730521m 0.23758967281996157m"
        data-normal="0m -1.3435883843274954e-7m 0.999999999999991m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">First Darshan</div></button
      ><button
        class="Hotspot"
        slot="hotspot-3"
        data-position="-6.164940586138704m 0.8393276346998498m 1.7234260852611474m"
        data-normal="2.0281593277369178e-7m 0m 0.9999999999999795m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Initiation into sainthood</div>
      </button>

      <button
        class="Hotspot"
        slot="hotspot-4"
        data-position="-3.990984366010637m 0.06762638688087463m 4.138576231588033m"
        data-normal="0m 1m 0m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Gift 1</div></button
      ><button
        class="Hotspot"
        slot="hotspot-5"
        data-position="-1.4307039185575057m 0.06762638688087463m 3.1208399696004m"
        data-normal="0m 1m 0m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Gift 2</div></button
      ><button
        class="Hotspot"
        slot="hotspot-6"
        data-position="1.80648990144236m 0.10612018523932995m 3.188818995587826m"
        data-normal="-0.3864149580913157m 0m 0.92232504040782m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Gift 3</div></button
      ><button
        class="Hotspot"
        slot="hotspot-7"
        data-position="4.18985005653187m 0.13162250840882173m 4.0840124825234945m"
        data-normal="0m 1m 0m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Gift 4</div>
      </button>
      <button
        class="Hotspot"
        slot="hotspot-8"
        data-position="6.2727654086194375m 0.6722489049527614m 0.6790216620608382m"
        data-normal="0m 1m 0m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Swamiji's Crowned Jewel</div></button
      ><button
        class="Hotspot"
        slot="hotspot-9"
        data-position="7.176554397876695m 1.334176343244453m -0.19203180885681614m"
        data-normal="0m 1m 0m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">50+ Years</div></button
      ><button
        class="Hotspot"
        slot="hotspot-10"
        data-position="6.4487396568981765m 2.348378070315633m -1.4765693114277716m"
        data-normal="0m 1m 0m"
        data-visibility-attribute="visible"
      >
        <div class="HotspotAnnotation">Hariprabodham Dham</div>
      </button>

      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>
    </model-viewer>

    <!-- Overlay message box -->
    <div id="overlay-message" class="overlay-message">
      <div class="overlay-content">
        <div class="overlay-header">
          <h3>Welcome to Annakut 2025!</h3>
          <button class="overlay-close" aria-label="Close message"></button>
        </div>
        <p>
          <span class="overlay-pulse-indicator"></span>
          <span
            >Here you can experience interactive Annakut darshan. Feel free to
            explore by tapping on the
            <span class="pulsating-word">pulsating</span> points.
          </span>
        </p>
      </div>
    </div>

    <!-- Orientation lock message for mobile portrait -->
    <div id="orientation-message" class="orientation-message">
      <div class="orientation-content">
        <div class="orientation-icon">📱</div>
        <h2>Please Rotate Your Device</h2>
        <p>
          This experience is optimized for landscape mode. Please rotate your
          device to continue.
        </p>
      </div>
    </div>

    <!-- Modal backdrop (shared by all modals) -->
    <div class="modal-backdrop"></div>

    <!-- Modals will be dynamically generated from modal-data.json -->
    <!-- Modal structure template (will be created by script) -->

    <script src="modal.js?v=1.0.0"></script>
    <script src="script.js?v=1.0.0"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
  </body>
</html>
